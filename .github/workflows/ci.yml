name: CI

# No Microsoft 365 credential, tenant identifier or secret is used anywhere in this workflow.
# Every test runs against a mocked Microsoft Graph.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three desktop platforms: this application ships on all of them, and a
        # platform-specific defect that only CI on one OS would miss is exactly the kind of
        # bug that reaches users.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SharePointLinkManifestBuilder.slnx

      - name: Verify formatting
        run: dotnet format SharePointLinkManifestBuilder.slnx --verify-no-changes --severity warn

      - name: Build
        run: dotnet build SharePointLinkManifestBuilder.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test SharePointLinkManifestBuilder.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results-${{ matrix.os }}.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          retention-days: 14
          if-no-files-found: warn
