version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies]
    groups:
      # Avalonia packages must move together; a mixed set fails at runtime rather than
      # at build time, which is a nasty way to find out.
      avalonia:
        patterns: ["Avalonia*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      microsoft-identity:
        patterns: ["Microsoft.Identity.*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "NSubstitute", "coverlet.*"]

    ignore:
      # xunit.v3 v4 cannot be taken while the headless UI tests exist. Avalonia.Headless.XUnit
      # pins xunit.v3.extensibility.core to 3.2.2 and its AvaloniaFactDiscoverer calls
      # TestIntrospectionHelper.GetTestCaseDetails with a signature v4 removed, so every
      # [AvaloniaFact] fails at discovery with MissingMethodException while the other 422 tests
      # pass. Avalonia 12.1.2 is the newest release and still pins 3.2.2, so this is not
      # something a version bump on our side can resolve.
      #
      # Remove this entry once Avalonia ships a build referencing xunit.v3 4.x. Minor and patch
      # updates within 3.x are deliberately still offered.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]
